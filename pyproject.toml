[project]
name = "calendly-mcp"
version = "0.1.0"
description = "Calendly MCP server for the MSPbots Agent platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp[cli]>=1.9.0,<2.0.0",
  "httpx>=0.27,<1.0",
  "pydantic-settings>=2.0,<3.0",
  "uvicorn>=0.30,<1.0",
  "starlette>=0.37,<1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calendly_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
